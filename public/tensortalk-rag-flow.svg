<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">TensorTalk RAG Flow</title>
  <desc id="desc">TensorTalk offers semantic vector retrieval by default and lexical MiniSearch as an alternate path. Semantic mode uses OpenRouter BGE embeddings, SQLite vectors, inner product search, and metadata reranking.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .green { fill: #e9f8f1; stroke: #4b9b80; stroke-width: 2; }
      .blue { fill: #edf4ff; stroke: #6689db; stroke-width: 2; }
      .gold { fill: #fff5df; stroke: #c8932d; stroke-width: 2; }
      .label { font: 800 24px Inter, Arial, sans-serif; fill: #172033; }
      .small { font: 500 17px Inter, Arial, sans-serif; fill: #536177; }
      .tiny { font: 500 14px Inter, Arial, sans-serif; fill: #64748b; }
      .title { font: 800 38px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #536177; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .greenArrow { stroke: #2f856c; stroke-width: 4; fill: none; marker-end: url(#greenArrow); }
      .blueArrow { stroke: #526fc3; stroke-width: 4; fill: none; marker-end: url(#blueArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f856c" />
    </marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#526fc3" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820" />
  <text class="title" x="700" y="66" text-anchor="middle">TensorTalk RAG Flow</text>
  <text class="subtitle" x="700" y="102" text-anchor="middle">Default semantic retrieval mirrors the notebook behavior; lexical retrieval remains available</text>

  <rect class="box" x="70" y="190" width="245" height="110" rx="16" />
  <text class="label" x="192.5" y="238" text-anchor="middle">Question</text>
  <text class="small" x="192.5" y="270" text-anchor="middle">student input</text>

  <rect class="box" x="410" y="190" width="245" height="110" rx="16" />
  <text class="label" x="532.5" y="238" text-anchor="middle">Mode Select</text>
  <text class="small" x="532.5" y="270" text-anchor="middle">semantic default</text>

  <path class="arrow" d="M315 245 H410" />

  <rect class="green" x="115" y="410" width="245" height="118" rx="16" />
  <text class="label" x="237.5" y="458" text-anchor="middle">Embed Query</text>
  <text class="small" x="237.5" y="490" text-anchor="middle">OpenRouter</text>
  <text class="tiny" x="237.5" y="515" text-anchor="middle">baai/bge-base-en-v1.5</text>

  <rect class="green" x="440" y="410" width="245" height="118" rx="16" />
  <text class="label" x="562.5" y="458" text-anchor="middle">SQLite Search</text>
  <text class="small" x="562.5" y="490" text-anchor="middle">normalized vectors</text>
  <text class="tiny" x="562.5" y="515" text-anchor="middle">inner product</text>

  <rect class="green" x="765" y="410" width="245" height="118" rx="16" />
  <text class="label" x="887.5" y="458" text-anchor="middle">Rerank</text>
  <text class="small" x="887.5" y="490" text-anchor="middle">metadata-aware</text>
  <text class="tiny" x="887.5" y="515" text-anchor="middle">pool 12, top 3</text>

  <rect class="gold" x="1085" y="410" width="245" height="118" rx="16" />
  <text class="label" x="1207.5" y="458" text-anchor="middle">RunPod Chat</text>
  <text class="small" x="1207.5" y="490" text-anchor="middle">TensorTalk v2</text>
  <text class="tiny" x="1207.5" y="515" text-anchor="middle">fine-tuned answer</text>

  <path class="greenArrow" d="M532.5 300 C532.5 355 237.5 355 237.5 410" />
  <path class="greenArrow" d="M360 469 H440" />
  <path class="greenArrow" d="M685 469 H765" />
  <path class="greenArrow" d="M1010 469 H1085" />

  <rect class="blue" x="260" y="640" width="245" height="118" rx="16" />
  <text class="label" x="382.5" y="688" text-anchor="middle">MiniSearch</text>
  <text class="small" x="382.5" y="720" text-anchor="middle">fuzzy + prefix</text>
  <text class="tiny" x="382.5" y="745" text-anchor="middle">top 4 lexical chunks</text>

  <rect class="blue" x="585" y="640" width="245" height="118" rx="16" />
  <text class="label" x="707.5" y="688" text-anchor="middle">Prompt</text>
  <text class="small" x="707.5" y="720" text-anchor="middle">JSONL evidence</text>
  <text class="tiny" x="707.5" y="745" text-anchor="middle">same evidence schema</text>

  <rect class="gold" x="910" y="640" width="245" height="118" rx="16" />
  <text class="label" x="1032.5" y="688" text-anchor="middle">RunPod Chat</text>
  <text class="small" x="1032.5" y="720" text-anchor="middle">TensorTalk v2</text>
  <text class="tiny" x="1032.5" y="745" text-anchor="middle">existing path</text>

  <path class="blueArrow" d="M532.5 300 C532.5 585 382.5 585 382.5 640" />
  <path class="blueArrow" d="M505 699 H585" />
  <path class="blueArrow" d="M830 699 H910" />
</svg>
