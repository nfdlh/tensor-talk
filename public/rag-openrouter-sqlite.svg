<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TensorTalk Semantic Retrieval Pipeline</title>
  <desc id="desc">Semantic TensorTalk retrieval uses OpenRouter BGE embeddings, a SQLite vector store, inner-product search, metadata-aware reranking, and the RunPod vLLM TensorTalk model grounded in handbook evidence.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .semantic { fill: #e9f8f1; stroke: #4b9b80; stroke-width: 2; }
      .data { fill: #eef3ff; stroke: #6689db; stroke-width: 2; }
      .model { fill: #fff5df; stroke: #c8932d; stroke-width: 2; }
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 21px Inter, Arial, sans-serif; fill: #536177; }
      .label { font: 800 25px Inter, Arial, sans-serif; fill: #172033; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #536177; }
      .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #526fc3; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .greenArrow { stroke: #2f856c; stroke-width: 4; fill: none; marker-end: url(#greenArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#526fc3" />
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f856c" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900" />
  <text class="title" x="800" y="78" text-anchor="middle">TensorTalk Semantic Retrieval Pipeline</text>
  <text class="subtitle" x="800" y="118" text-anchor="middle">OpenRouter BGE embeddings + SQLite vectors mirror the notebook RAG path without local GPU inference</text>

  <rect class="panel" x="90" y="210" width="250" height="120" rx="16" />
  <text class="label" x="215" y="260" text-anchor="middle">Question</text>
  <text class="small" x="215" y="292" text-anchor="middle">student handbook query</text>

  <rect class="semantic" x="445" y="210" width="300" height="120" rx="16" />
  <text class="label" x="595" y="252" text-anchor="middle">Embed Query</text>
  <text class="small" x="595" y="284" text-anchor="middle">OpenRouter embeddings</text>
  <text class="tiny" x="595" y="309" text-anchor="middle">baai/bge-base-en-v1.5</text>

  <rect class="data" x="850" y="190" width="315" height="160" rx="16" />
  <text class="label" x="1007.5" y="242" text-anchor="middle">SQLite Vector DB</text>
  <text class="small" x="1007.5" y="274" text-anchor="middle">data/UM_RAG_Vectors.sqlite</text>
  <text class="tiny" x="1007.5" y="303" text-anchor="middle">521 normalized retrieval_text embeddings</text>
  <text class="tiny" x="1007.5" y="327" text-anchor="middle">built by scripts/build-rag-index.ts</text>

  <rect class="semantic" x="1270" y="210" width="250" height="120" rx="16" />
  <text class="label" x="1395" y="260" text-anchor="middle">Vector Search</text>
  <text class="small" x="1395" y="292" text-anchor="middle">inner product pool 12</text>

  <path class="greenArrow" d="M340 270 H445" />
  <path class="greenArrow" d="M745 270 H850" />
  <path class="greenArrow" d="M1165 270 H1270" />

  <rect class="semantic" x="210" y="540" width="300" height="135" rx="16" />
  <text class="label" x="360" y="588" text-anchor="middle">Metadata Rerank</text>
  <text class="small" x="360" y="620" text-anchor="middle">dense score + notebook priors</text>
  <text class="tiny" x="360" y="647" text-anchor="middle">scope, section, subsection, document, keywords</text>

  <rect class="data" x="650" y="540" width="300" height="135" rx="16" />
  <text class="label" x="800" y="588" text-anchor="middle">Top Evidence</text>
  <text class="small" x="800" y="620" text-anchor="middle">top 3 handbook chunks</text>
  <text class="tiny" x="800" y="647" text-anchor="middle">same evidence schema as lexical mode</text>

  <rect class="model" x="1090" y="540" width="300" height="135" rx="16" />
  <text class="label" x="1240" y="588" text-anchor="middle">RunPod vLLM</text>
  <text class="small" x="1240" y="620" text-anchor="middle">nfdlh/tensortalk-v2</text>
  <text class="tiny" x="1240" y="647" text-anchor="middle">fine-tuned answer grounded by evidence</text>

  <path class="greenArrow" d="M1395 330 C1395 465 360 405 360 540" />
  <path class="greenArrow" d="M510 608 H650" />
  <path class="arrow" d="M950 608 H1090" />

  <rect class="panel" x="270" y="760" width="1060" height="72" rx="16" />
  <text class="small" x="800" y="804" text-anchor="middle">The chat UI defaults to this semantic path; lexical MiniSearch remains selectable for the original TensorTalk endpoint behavior.</text>
</svg>
