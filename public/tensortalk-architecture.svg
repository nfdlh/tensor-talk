<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">TensorTalk Dual Retrieval Architecture</title>
  <desc id="desc">TensorTalk uses a Next.js API with selectable semantic and lexical retrieval. Semantic mode uses OpenRouter BGE embeddings, SQLite vectors, metadata reranking, and the RunPod TensorTalk endpoint. Lexical mode keeps MiniSearch and the same RunPod TensorTalk endpoint.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cfd8e6; stroke-width: 2; }
      .semantic { fill: #e8f6f1; stroke: #5aa58b; stroke-width: 2; }
      .lexical { fill: #eef3ff; stroke: #6e88d8; stroke-width: 2; }
      .model { fill: #fff4dc; stroke: #c9982e; stroke-width: 2; }
      .warn { fill: #fff0ed; stroke: #d97d67; stroke-width: 2; }
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #14213d; }
      .subtitle { font: 500 22px Inter, Arial, sans-serif; fill: #536079; }
      .label { font: 800 25px Inter, Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #4b5870; }
      .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #607089; }
      .arrow { stroke: #66758e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .semanticArrow { stroke: #31866d; stroke-width: 4; fill: none; marker-end: url(#arrowSemantic); }
      .lexicalArrow { stroke: #536fc4; stroke-width: 4; fill: none; marker-end: url(#arrowLexical); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#66758e" />
    </marker>
    <marker id="arrowSemantic" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#31866d" />
    </marker>
    <marker id="arrowLexical" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#536fc4" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="980" />
  <text class="title" x="800" y="70" text-anchor="middle">TensorTalk Dual Retrieval Architecture</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">Semantic vectors are the default; lexical MiniSearch remains selectable</text>

  <rect class="panel" x="70" y="210" width="250" height="130" rx="16" />
  <text class="label" x="195" y="262" text-anchor="middle">Student UI</text>
  <text class="small" x="195" y="294" text-anchor="middle">chat interface</text>
  <text class="tiny" x="195" y="320" text-anchor="middle">semantic selected by default</text>

  <rect class="panel" x="430" y="210" width="260" height="130" rx="16" />
  <text class="label" x="560" y="262" text-anchor="middle">Next.js API</text>
  <text class="small" x="560" y="294" text-anchor="middle">POST /api/chat</text>
  <text class="tiny" x="560" y="320" text-anchor="middle">build prompt + stream answer</text>

  <rect class="panel" x="795" y="210" width="260" height="130" rx="16" />
  <text class="label" x="925" y="262" text-anchor="middle">Mode Selector</text>
  <text class="small" x="925" y="294" text-anchor="middle">semantic or lexical</text>
  <text class="tiny" x="925" y="320" text-anchor="middle">same evidence shape</text>

  <path class="arrow" d="M320 275 H430" />
  <path class="arrow" d="M690 275 H795" />

  <rect class="semantic" x="170" y="470" width="310" height="135" rx="16" />
  <text class="label" x="325" y="520" text-anchor="middle">Semantic Retrieval</text>
  <text class="small" x="325" y="552" text-anchor="middle">OpenRouter embeddings</text>
  <text class="tiny" x="325" y="579" text-anchor="middle">baai/bge-base-en-v1.5</text>

  <rect class="semantic" x="575" y="470" width="310" height="135" rx="16" />
  <text class="label" x="730" y="520" text-anchor="middle">SQLite Vectors</text>
  <text class="small" x="730" y="552" text-anchor="middle">521 normalized chunks</text>
  <text class="tiny" x="730" y="579" text-anchor="middle">inner product similarity</text>

  <rect class="semantic" x="980" y="470" width="310" height="135" rx="16" />
  <text class="label" x="1135" y="520" text-anchor="middle">Metadata Rerank</text>
  <text class="small" x="1135" y="552" text-anchor="middle">pool 12, top 3</text>
  <text class="tiny" x="1135" y="579" text-anchor="middle">scope, section, keywords</text>

  <rect class="model" x="1335" y="470" width="210" height="135" rx="16" />
  <text class="label" x="1440" y="520" text-anchor="middle">RunPod</text>
  <text class="small" x="1440" y="552" text-anchor="middle">vLLM TensorTalk</text>
  <text class="tiny" x="1440" y="579" text-anchor="middle">nfdlh/tensortalk-v2</text>

  <path class="semanticArrow" d="M925 340 C925 405 325 405 325 470" />
  <path class="semanticArrow" d="M480 538 H575" />
  <path class="semanticArrow" d="M885 538 H980" />
  <path class="semanticArrow" d="M1290 538 H1335" />

  <rect class="lexical" x="250" y="730" width="310" height="135" rx="16" />
  <text class="label" x="405" y="780" text-anchor="middle">Lexical Retrieval</text>
  <text class="small" x="405" y="812" text-anchor="middle">MiniSearch</text>
  <text class="tiny" x="405" y="839" text-anchor="middle">fuzzy + prefix + filters</text>

  <rect class="lexical" x="655" y="730" width="310" height="135" rx="16" />
  <text class="label" x="810" y="780" text-anchor="middle">JSONL KB</text>
  <text class="small" x="810" y="812" text-anchor="middle">521 handbook rows</text>
  <text class="tiny" x="810" y="839" text-anchor="middle">top 4 lexical evidence</text>

  <rect class="model" x="1060" y="730" width="310" height="135" rx="16" />
  <text class="label" x="1215" y="780" text-anchor="middle">RunPod vLLM</text>
  <text class="small" x="1215" y="812" text-anchor="middle">nfdlh/tensortalk-v2</text>
  <text class="tiny" x="1215" y="839" text-anchor="middle">existing endpoint path</text>

  <path class="lexicalArrow" d="M925 340 C925 665 405 665 405 730" />
  <path class="lexicalArrow" d="M560 798 H655" />
  <path class="lexicalArrow" d="M965 798 H1060" />

  <rect class="warn" x="70" y="885" width="1460" height="58" rx="14" />
  <text class="small" x="800" y="920" text-anchor="middle">No local answer fallback: semantic mode needs OPENROUTER_API_KEY and the SQLite index; lexical mode needs the RunPod TensorTalk endpoint.</text>
</svg>
